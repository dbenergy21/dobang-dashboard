<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>도방 모바일 — 두수·백신</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#f1f5f9; --dim:#94a3b8;
          --red:#f87171; --yellow:#fbbf24; --green:#4ade80; --blue:#60a5fa; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--txt); font-family:'Malgun Gothic',system-ui,sans-serif;
         font-size:16px; padding:12px 12px 90px; max-width:560px; margin:0 auto; }
  h1 { font-size:19px; display:flex; justify-content:space-between; align-items:center; padding:4px 2px 10px; }
  h1 small { font-size:12px; color:var(--dim); font-weight:normal; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:15px; color:var(--dim); margin-bottom:10px; letter-spacing:.5px; }
  .big { font-size:34px; font-weight:800; line-height:1.1; }
  .delta { font-size:15px; margin-left:8px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
  .cell { background:#0b1220; border-radius:10px; padding:10px 12px; }
  .cell .k { font-size:12px; color:var(--dim); }
  .cell .v { font-size:20px; font-weight:700; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--dim); font-weight:normal; font-size:12px; }
  td.num { text-align:right; font-weight:700; }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; }
  .tag.overdue { background:#7f1d1d; color:#fecaca; }
  .tag.soon { background:#78350f; color:#fde68a; }
  .tag.later { background:#14532d; color:#bbf7d0; }
  .muted { color:var(--dim); font-size:12px; margin-top:8px; }
  .err { color:var(--red); font-size:13px; padding:6px 0; }
  #bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:10px 12px;
         padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:rgba(15,23,42,.96);
         border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
  .btn { flex:1; text-align:center; padding:13px 0; border-radius:12px; font-size:15px; font-weight:700;
         text-decoration:none; border:none; cursor:pointer; }
  .btn.primary { background:#2563eb; color:#fff; }
  .btn.ghost { background:var(--card); color:var(--txt); border:1px solid var(--line); }
</style>
</head>
<body>
<h1>🐷 도방 현황 <small id="stamp">불러오는 중…</small></h1>

<div class="card" id="herdCard">
  <h2>두수</h2>
  <div><span class="big" id="total">—</span><span class="delta" id="delta"></span></div>
  <div class="grid" id="sections"></div>
  <div class="muted" id="herdMeta"></div>
</div>

<div class="card">
  <h2>폐사 상위 돈사 (최근 분석)</h2>
  <table><tbody id="barns"><tr><td class="err">불러오는 중…</td></tr></tbody></table>
  <div class="muted" id="barnMeta"></div>
</div>

<div class="card">
  <h2>백신 — 이전 원장 기준 (현재 군 연결 미완료)</h2>
  <table><thead><tr><th>백신</th><th>대상</th><th style="text-align:right">D-day</th></tr></thead>
  <tbody id="vax"><tr><td class="err" colspan="3">불러오는 중…</td></tr></tbody></table>
  <div class="muted" id="vaxMeta"></div>
</div>

<div id="bar">
  <button class="btn ghost" onclick="loadAll(true)">🔄 새로고침</button>
  <a class="btn primary" href="https://t.me/dobang_farm_bot">💬 도비에게 지시</a>
</div>

  return (isNaN(a) || isNaN(b)) ? null : Math.round((b - a) / 86400000);

  for (var i = 0; i < keys.length; i++) {

<script>
const fmt = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString("ko-KR");
const qs = s => document.querySelector(s);

async function getJson(path) {
  const r = await fetch(path + "?_=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function renderHerd(h) {
  const v = stockSnapshotView(h, "current_total", new Date().toLocaleDateString("sv-SE", {timeZone:"Asia/Seoul"}));
  qs("#total").textContent = v.total == null ? "미확인" : fmt(v.total) + "두";
  const el = qs("#delta"), d = v.delta;
  if (v.deltaText) { el.textContent = v.deltaText; el.style.color = "var(--dim)"; }
  else { el.textContent = d == null ? "" : (d > 0 ? "+" : "") + fmt(d) + " (기준 " + (h.base_date || "?") + ")";
         el.style.color = d < 0 ? "var(--red)" : "var(--green)"; }
  const s = h.sections || {}, p = v.sections;
  const items = p ? [["번식돈", p.breeding], ["자돈사", p.jadan], ["인큐", p.incu], ["비육", p.beef], ["돈궁", p.special]]
                  : [["기존 원장 모돈", (s.modon || {}).count], ["기존 원장 자돈사", (s.jadan || {}).count],
                     ["기존 원장 인큐", (s.incu || {}).count], ["기존 원장 비육", (s.beef || {}).count]];
  qs("#sections").innerHTML = items.map(([k, x]) =>
    `<div class="cell"><div class="k">${k}</div><div class="v">${fmt(v.total == null ? null : x)}</div></div>`).join("");
  const m = qs("#herdMeta"); m.style.whiteSpace = "pre-line";
  m.textContent = [v.label, v.warn, v.ledgerNote,
    `누적 폐사 ${fmt(h.death_total)} · 누적 출하 ${fmt(h.ship_total)} (기존 원장의 별도 출처·기간, 실사 미대조)`,
    "포유자돈 별도 미기재 · 현재 군 연결 및 군별 백신 대조 미완료"]
    .filter(Boolean).join("\n");
}

function renderBarns(l) {
  const rows = (l.barns || []).slice(0, 6).map(b =>
    `<tr><td>${b.name}</td><td class="num" style="color:var(--red)">${fmt(b.deaths)}두</td></tr>`);
  qs("#barns").innerHTML = rows.join("") || `<tr><td class="err">데이터 없음</td></tr>`;
  qs("#barnMeta").textContent = "분석 갱신: " + (l.analysis_updated || "?");
}

function renderVax(v) {
  const list = (v.vaccines || []).filter(x => x.status !== "done");
  list.sort((a, b) => (a.d_day ?? 999) - (b.d_day ?? 999));
  const rows = list.slice(0, 10).map(x => {
    const d = x.d_day;
    const cls = d < 0 ? "overdue" : (d <= 3 ? "soon" : "later");
    const label = d < 0 ? `지연 ${-d}일` : (d === 0 ? "오늘" : `D-${d}`);
    return `<tr><td>${x.name || "?"}</td><td style="color:var(--dim)">${x.target || ""}</td>
            <td class="num"><span class="tag ${cls}">${label}</span></td></tr>`;
  });
  qs("#vax").innerHTML = rows.join("") || `<tr><td colspan="3" style="color:var(--green)">미완료 백신 없음 ✓</td></tr>`;
  const overdue = list.filter(x => (x.d_day ?? 0) < 0).length;
  qs("#vaxMeta").textContent =
    `미완료 ${list.length}건 (지연 ${overdue}건) · 생성 ${String(v.generated_at || "?").slice(5, 16).replace("T", " ")}`;
}

async function loadAll(manual) {
  try {
    const [h, l, v] = await Promise.all([
      getJson("headcount.json"), getJson("livestock_summary.json"), getJson("vaccines.json"),
    ]);
    renderHerd(h); renderBarns(l); renderVax(v);
    qs("#stamp").textContent = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) + " 갱신";
  } catch (e) {
    qs("#stamp").textContent = "갱신 실패";
    if (manual) alert("데이터 로드 실패: " + e.message);
  }
}
loadAll(false);
setInterval(() => loadAll(false), 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(false); });
</script>
</body>
</html>
